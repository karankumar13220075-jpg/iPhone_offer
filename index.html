<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #111827;
      padding: 25px 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 45px auto 20px;
      box-shadow: 0 10px 35px rgba(99,102,241,.35);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 35px;
    }

    .card {
      background: #1f2937;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .hidden {
      display: none;
    }

    .otp {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .otp input {
      text-align: center;
      font-size: 22px;
    }

    .back {
      background: transparent;
      border: 1px solid #374151;
    }

    .chat {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .chat-header {
      padding: 20px 0;
      border-bottom: 1px solid #374151;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .messages {
      flex: 1;
      padding: 20px 0;
      overflow-y: auto;
    }

    .message {
      padding: 13px 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
    }

    .ai {
      background: #1f2937;
    }

    .user {
      background: #4f46e5;
      margin-left: auto;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 15px 0;
    }

    .chat-input input {
      flex: 1;
    }

    .send {
      width: 55px;
      margin: 0;
    }

    .small {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <section id="login">
    <div class="logo">🤖</div>

    <h1>My Private AI</h1>
    <p class="subtitle">आपका निजी AI Assistant</p>

    <div class="card">
      <label>मोबाइल नंबर</label>

      <input
        id="phone"
        type="tel"
        maxlength="10"
        placeholder="10 अंकों का नंबर डालें"
      >

      <button onclick="sendOTP()">
        Continue
      </button>

      <p class="small">
        यह निजी AI इंटरफेस है
      </p>
    </div>
  </section>


  <!-- OTP -->
  <section id="verification" class="hidden">

    <div class="logo">🔐</div>

    <h1>Verify Number</h1>

    <p class="subtitle">
      आपके नंबर पर भेजे गए OTP को डालें
    </p>

    <div class="card">

      <div class="otp">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
      </div>

      <button onclick="verifyOTP()">
        Verify
      </button>

      <button class="back" onclick="backToLogin()">
        वापस जाएँ
      </button>

      <p id="otpMessage" class="small"></p>

    </div>
  </section>


  <!-- AI CHAT -->
  <section id="chat" class="chat">

    <div class="chat-header">
      <div class="ai-icon">🤖</div>
      <div>
        <strong>My Private AI</strong>
        <div style="color:#9ca3af;font-size:12px;">
          Private Assistant
        </div>
      </div>
    </div>

    <div id="messages" class="messages">

      <div class="message ai">
        नमस्ते! 👋 मैं आपका Private AI हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
      </div>

    </div>

    <div class="chat-input">
      <input
        id="messageInput"
        type="text"
        placeholder="अपना संदेश लिखें..."
        onkeydown="handleEnter(event)"
      >

      <button class="send" onclick="sendMessage()">
        ➤
      </button>
    </div>

  </section>

</div>


<script>

  /*
    IMPORTANT:
    यह अभी DEMO OTP UI है।
    असली OTP verification के लिए सुरक्षित backend
    और वास्तविक authentication/SMS service जोड़नी होगी।
  */

  function sendOTP() {

    const phone = document.getElementById("phone").value.trim();

    if (phone.length !== 10 || !/^[0-9]+$/.test(phone)) {
      alert("कृपया सही 10 अंकों का मोबाइल नंबर डालें।");
      return;
    }

    document.getElementById("login").classList.add("hidden");
    document.getElementById("verification").classList.remove("hidden");

    document.getElementById("otpMessage").innerText =
      "OTP verification के लिए तैयार है।";
  }


  function verifyOTP() {

    const boxes = document.querySelectorAll(".otp input");

    let otp = "";

    boxes.forEach(box => {
      otp += box.value;
    });

    if (otp.length !== 6) {
      alert("कृपया 6 अंकों का OTP डालें।");
      return;
    }

    /*
      Demo flow:
      असली प्रोडक्शन ऐप में यहाँ server से OTP verify होगा।
    */

    document.getElementById("verification").classList.add("hidden");
    document.getElementById("chat").style.display = "flex";

  }


  function backToLogin() {

    document.getElementById("verification")
      .classList.add("hidden");

    document.getElementById("login")
      .classList.remove("hidden");

  }


  function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    const messages = document.getElementById("messages");

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.innerText = text;

    messages.appendChild(userMessage);

    input.value = "";

    setTimeout(() => {

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";

      aiMessage.innerText =
        "मैं अभी Demo Mode में हूँ। असली AI जवाब के लिए इसमें आपका AI API या local AI model जोड़ना होगा।";

      messages.appendChild(aiMessage);

      messages.scrollTop = messages.scrollHeight;

    }, 500);

  }


  function handleEnter(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }


  // OTP boxes में अपने-आप अगला box
  document.querySelectorAll(".otp input").forEach((input, index, boxes) => {

    input.addEventListener("input", () => {

      if (input.value && index < boxes.length - 1) {
        boxes[index + 1].focus();
      }

    });

  });

</script>

</body>
</html>
